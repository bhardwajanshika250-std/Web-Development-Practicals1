<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typography</title>
    <style>
        body {
            font-size: 1rem;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Base size for small screens */
        h1 {
            font-size: 1.5rem;
            color: #1d3557;
        }

        /* Scaled heading size for screens 600px and up */
        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>Dynamic Responsive Heading</h1>
    <p>This paragraph has a base font size of 1rem. Resize the browser window above 600px to see the h1 heading scale up from 1.5rem to 2.5rem.</p>
</body>
</html>

:root {
    --primary-color: #1d3557;
    --accent-color: #e63946;
    --heading-size: 2rem;
    --spacing-value: 16px;
}

body {
    color: var(--primary-color);
    padding: var(--spacing-value);
}

h1 {
    color: var(--accent-color);
    font-size: var(--heading-size);
}

p {
    margin-bottom: var(--spacing-value);
}
